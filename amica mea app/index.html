const generateOpenGym = (schedule, massage) => {
  const result = {};
  const allDays = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
  allDays.forEach(day => {
    const slots = [];
    const courses = schedule[day] || [];
    const massages = massage[day] || [];
    // Alle belegten Zeiten sammeln (Start bis Ende in Minuten)
    const blocked = [];
    courses.forEach(c => {
      const [h, m] = c.time.split(":").map(Number);
      blocked.push({ start: h * 60 + m, end: h * 60 + m + c.dur });
    });
    massages.forEach(s => {
      const [h, m] = s.time.split(":").map(Number);
      blocked.push({ start: h * 60 + m, end: h * 60 + m + 30 });
    });
    // Jede volle Stunde von 7 bis 21 prüfen (letzter Slot 21:00, endet 21:45)
    for (let hour = 7; hour <= 21; hour++) {
      const slotStart = hour * 60;
      const slotEnd = slotStart + 45;
      // Prüfen ob sich der 45-Min-Slot mit einem Kurs oder einer Massage überschneidet
      const conflict = blocked.some(b => slotStart < b.end && slotEnd > b.start);
      if (!conflict) {
        const timeStr = String(hour).padStart(2, "0") + ":00";
        slots.push({ id: 3000 + allDays.indexOf(day) * 100 + hour, time: timeStr });
      }
    }
    result[day] = slots;
  });
  return result;
};

const addToGoogleCal = (date, time, label, durationMin = 45, setPopup) => {
  const [h, m] = time.split(":").map(Number);
  const start = new Date(date); start.setHours(h, m, 0, 0);
  const end = new Date(start); end.setMinutes(end.getMinutes() + durationMin);
  const fmt = (d) => {
    const Y = d.getFullYear(), M = String(d.getMonth()+1).padStart(2,"0"), D = String(d.getDate()).padStart(2,"0");
    const hh = String(d.getHours()).padStart(2,"0"), mm = String(d.getMinutes()).padStart(2,"0");
    return `${Y}${M}${D}T${hh}${mm}00`;
  };
  const url = `https://www.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(label + " – amica mea")}&dates=${fmt(start)}/${fmt(end)}&ctz=Europe/Berlin&location=${encodeURIComponent("Waltherstraße 49-51, 51069 Köln-Dellbrück")}`;
  window.open(url, "_blank");
  if (setPopup) setPopup({ text: "📅 Google Kalender wird geöffnet", type: "booked" });
};
const addToAppleCal = (date, time, label, durationMin = 45, setPopup) => {
  const [h, m] = time.split(":").map(Number);
  const start = new Date(date); start.setHours(h, m, 0, 0);
  const end = new Date(start); end.setMinutes(end.getMinutes() + durationMin);
  const fmt = (d) => {
    const Y = d.getFullYear(), M = String(d.getMonth()+1).padStart(2,"0"), D = String(d.getDate()).padStart(2,"0");
    const hh = String(d.getHours()).padStart(2,"0"), mm = String(d.getMinutes()).padStart(2,"0");
    return `${Y}${M}${D}T${hh}${mm}00`;
  };
  const ics = [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Amica Mea//App//DE", "CALSCALE:GREGORIAN", "METHOD:PUBLISH",
    "BEGIN:VEVENT", `DTSTART;TZID=Europe/Berlin:${fmt(start)}`, `DTEND;TZID=Europe/Berlin:${fmt(end)}`,
    `SUMMARY:${label} – amica mea`, "LOCATION:Waltherstraße 49-51, 51069 Köln-Dellbrück",
    `UID:${Date.now()}@amicamea`, "END:VEVENT", "END:VCALENDAR", ""
  ].join("\r\n");
  const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = `${label.replace(/\s/g, "_")}.ics`; a.click();
  URL.revokeObjectURL(url);
  if (setPopup) setPopup({ text: "📅 Kalenderdatei geladen", type: "booked" });
};
